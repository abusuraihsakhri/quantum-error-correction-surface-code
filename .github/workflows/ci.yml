name: Surface code CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents surface_code_qec tests cli.py enrichment.py
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          node --check web/worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1, "Expected one inline application script"
          Path('/tmp/qec-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/qec-inline.js
