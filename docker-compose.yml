version: '3.8'

services:
  quantum-error-correction-surface-code:
    build: .
    container_name: quantum-error-correction-surface-code
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=quantum-error-correction-surface-code-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
